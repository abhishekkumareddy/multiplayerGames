[build]
  publish = "client/dist"
  command = "npm run build:client"

[build.environment]
  NODE_VERSION = "22"
  VITE_SOCKET_URL = "https://multiplayergames-2.onrender.com"

# SPA Fallback for client-side routing (e.g. /room/AB12CD or /?room=AB12CD)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
