services:
  - type: web
    name: friends-arcade-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:server
    startCommand: node server/dist/server/src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: "https://friendsarcade.fun,https://www.friendsarcade.fun,http://localhost:5173"
      - key: CLIENT_ORIGIN
        value: "https://friendsarcade.fun,https://www.friendsarcade.fun,http://localhost:5173"
